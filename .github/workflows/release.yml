name: release
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - run: swift test --package-path Packages/AutoPauseEngine
      # Empty CODE_SIGN_IDENTITY falls back to "-" (ad-hoc lane) in build-app.sh.
      # Sonar is distributed without a paid Apple Developer account, so this
      # build is ad-hoc signed and NOT notarized. That is a supported state,
      # not a mistake, with one measured consequence: Homebrew downloads with
      # curl, which sets no quarantine attribute, so `brew install --cask`
      # lands a working app in /Applications. A browser download does set it,
      # and Gatekeeper's assessment of the app is "rejected", so a user who
      # fetches the zip by hand may have to approve it once in System
      # Settings > Privacy & Security. Warn loudly; do not block the release.
      - name: signing-state
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -z "${APPLE_DEVELOPER_ID:-}" ]; then
            echo "::warning::No APPLE_DEVELOPER_ID secret. This release is ad-hoc signed and un-notarized. brew install --cask sonar is unaffected; browser downloads of the zip may require a one-time manual approval."
          else
            echo "Developer ID present: signing, notarizing and stapling."
          fi
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      - run: scripts/build-app.sh
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          # CFBundleVersion is the build identity Homebrew and `about` show.
          # The git commit count is the fallback for local builds.
          BUILD_NUMBER: ${{ github.run_number }}
      - run: scripts/package-release.sh
      # The keychain profile `sign-release.sh` uses has to exist on the runner
      # first; a fresh GitHub runner has no such profile, so notarization would
      # fail with "no keychain profile" even with every secret configured.
      # `secrets` is NOT an available context in a step's `if:` - GitHub's
      # context table allows github/needs/strategy/matrix/job/runner/env/vars/
      # steps/inputs there, and nothing else. Referencing secrets.APPLE_...
      # directly makes the whole file invalid: the run is created, parses no
      # jobs, and fails as a "workflow file issue" with no log. That is what
      # every run before this commit was doing. Read the secret through `env`
      # instead, which *is* allowed in `if:`.
      - name: notary-credentials
        if: env.APPLE_DEVELOPER_ID != ''
        run: |
          xcrun notarytool store-credentials sonar-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      # Notarization runs only when the Developer ID secret exists.
      - name: notarize
        run: |
          if [ -z "${DEVELOPER_ID:-}" ]; then
            echo "No APPLE_DEVELOPER_ID secret — skipping notarization (ad-hoc artifact only)."
            exit 0
          fi
          scripts/sign-release.sh --release
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          NOTARY_PROFILE: sonar-notary
      # Fill in the cask's checksum so `brew install --cask` works without a
      # human editing a file between two CI runs.
      - name: cask-checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SHA="$(shasum -a 256 dist/*/Sonar-*.zip | cut -d" " -f1)"
          sed -i.bak "s/REPLACE_WITH_RELEASE_SHA256/$SHA/" Casks/sonar.rb
          rm -f Casks/sonar.rb.bak
          grep -q "REPLACE_WITH_RELEASE_SHA256" Casks/sonar.rb && exit 1
      - uses: softprops/action-gh-release@v2
        # Only publish on tag pushes; manual dispatches stop after packaging.
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*/Sonar-*.zip,dist/*/SHA256SUMS.txt,Casks/sonar.rb
          generate_release_notes: true
      # Owner: a follow-up job can push version+sha to your homebrew-tap
      # (scripts/bump-cask.sh) once the tap repo + token are configured.
