name: release
"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - run: swift test --package-path Packages/AutoPauseEngine
      # Empty CODE_SIGN_IDENTITY falls back to "-" (ad-hoc lane) in build-app.sh.
      - run: scripts/build-app.sh
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
          # CFBundleVersion must increase for Sparkle to ever offer an update.
          # The repo's BUILD_NUMBER file is the fallback for local builds.
          BUILD_NUMBER: ${{ github.run_number }}
      - run: scripts/package-release.sh
      # The keychain profile `sign-release.sh` uses has to exist on the runner
      # first; a fresh GitHub runner has no such profile, so notarization would
      # fail with "no keychain profile" even with every secret configured.
      - name: notary-credentials
        if: ${{ secrets.APPLE_DEVELOPER_ID != '' }}
        run: |
          xcrun notarytool store-credentials sonar-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      # Notarization runs only when the Developer ID secret exists.
      - name: notarize
        run: |
          if [ -z "${DEVELOPER_ID:-}" ]; then
            echo "No APPLE_DEVELOPER_ID secret — skipping notarization (ad-hoc artifact only)."
            exit 0
          fi
          scripts/sign-release.sh --release
        env:
          DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          NOTARY_PROFILE: sonar-notary
      # Must run AFTER notarization and BEFORE the upload: the feed records the
      # exact size of the zip users download, and sign-release.sh re-zips the
      # app after stapling. Fails the job rather than publishing a feed it
      # cannot sign, because Sparkle would offer an unsigned item and then
      # reject it at install time.
      - name: appcast
        if: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY != '' }}
        run: scripts/generate-appcast.sh "${GITHUB_REF_NAME#v}"
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          # sign_update is not on PATH; it ships inside the Sparkle package
          # that scripts/build-app.sh already resolved into dist/.
          SIGN_UPDATE: ${{ github.workspace }}/dist/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update
      # Fill in the cask's checksum so `brew install --cask` works without a
      # human editing a file between two CI runs.
      - name: cask-checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SHA="$(shasum -a 256 dist/*/Sonar-*.zip | cut -d" " -f1)"
          sed -i.bak "s/REPLACE_WITH_RELEASE_SHA256/$SHA/" Casks/sonar.rb
          rm -f Casks/sonar.rb.bak
          grep -q "REPLACE_WITH_RELEASE_SHA256" Casks/sonar.rb && exit 1
      - uses: softprops/action-gh-release@v2
        # Only publish on tag pushes; manual dispatches stop after packaging.
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*/Sonar-*.zip,dist/*/SHA256SUMS.txt,Sparkle/appcast.xml,Casks/sonar.rb
          generate_release_notes: true
      # Owner: a follow-up job can push version+sha to your homebrew-tap
      # (scripts/bump-cask.sh) once the tap repo + token are configured.
